<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Form Detection</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" /><input
        type="hidden"
        name="bot-field"
        value=""
      /><input type="text" name="name" /><input type="text" name="company" /><input
        type="email"
        name="email"
      /><input type="tel" name="phone" /><input type="text" name="type" /><textarea
        name="brief"
      ></textarea>
    </form>
  </body>
</html>
